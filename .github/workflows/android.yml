name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Detect release signing configuration
        env:
          KEYSTORE: ${{ secrets.PHNX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf 'PHNX_RELEASE_SIGNING_CONFIGURED=true\n' >> "$GITHUB_ENV"
          else
            printf 'PHNX_RELEASE_SIGNING_CONFIGURED=false\n' >> "$GITHUB_ENV"
          fi

      - name: Prepare release signing when configured
        if: ${{ env.PHNX_RELEASE_SIGNING_CONFIGURED == 'true' }}
        env:
          KEYSTORE: ${{ secrets.PHNX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHNX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PHNX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PHNX_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/phnx-release.keystore"
          test -s "$RUNNER_TEMP/phnx-release.keystore"
          printf 'PHNX_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/phnx-release.keystore" >> "$GITHUB_ENV"
          printf 'PHNX_KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'PHNX_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'PHNX_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build signed release APK when configured
        if: ${{ env.PHNX_RELEASE_SIGNING_CONFIGURED == 'true' }}
        run: ./gradlew assembleRelease

      - name: Build signed release AAB when configured
        if: ${{ env.PHNX_RELEASE_SIGNING_CONFIGURED == 'true' }}
        run: ./gradlew bundleRelease

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          VERSION_NAME=$(python3 -c "import re; print(re.search(r'versionName = (.+)', open('app/build.gradle.kts').read()).group(1).strip().strip(chr(34)))")
          VERSION_CODE=$(python3 -c "import re; print(re.search(r'versionCode = (\\d+)', open('app/build.gradle.kts').read()).group(1))")
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          test "$($AAPT dump badging app/build/outputs/apk/debug/app-debug.apk | python3 -c "import re,sys; print(re.search(r\"name='([^']+)'\", sys.stdin.read()).group(1))")" = "com.phoenix.phnx.debug"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/phnx-browser-${VERSION_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ] && [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            test "$($AAPT dump badging app/build/outputs/apk/release/app-release.apk | python3 -c "import re,sys; print(re.search(r\"name='([^']+)'\", sys.stdin.read()).group(1))")" = "com.phoenix.phnx"
            cp app/build/outputs/apk/release/app-release.apk "artifacts/phnx-browser-${VERSION_NAME}-release.apk"
            cp app/build/outputs/bundle/release/app-release.aab "artifacts/phnx-browser-${VERSION_NAME}-release.aab"
            RELEASE_SIGNING_STATUS=signed
          else
            RELEASE_SIGNING_STATUS=not-configured
          fi
          printf 'applicationId=com.phoenix.phnx\nversionName=%s\nversionCode=%s\nreleaseSigning=%s\n' "$VERSION_NAME" "$VERSION_CODE" "$RELEASE_SIGNING_STATUS" > artifacts/build-metadata.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: phnx-browser-${{ github.sha }}
          path: artifacts/
