name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          VERSION_NAME=$(python3 -c "import re; print(re.search(r'versionName = (.+)', open('app/build.gradle.kts').read()).group(1).strip().strip(chr(34)))")
          VERSION_CODE=$(python3 -c "import re; print(re.search(r'versionCode = (\\d+)', open('app/build.gradle.kts').read()).group(1))")
          AAPT="$ANDROID_HOME/build-tools/35.0.1/aapt"
          test "$($AAPT dump badging app/build/outputs/apk/debug/app-debug.apk | python3 -c "import re,sys; print(re.search(r\"name='([^']+)'\", sys.stdin.read()).group(1))")" = "com.phoenix.phnx.debug"
          test "$($AAPT dump badging app/build/outputs/apk/release/app-release-unsigned.apk | python3 -c "import re,sys; print(re.search(r\"name='([^']+)'\", sys.stdin.read()).group(1))")" = "com.phoenix.phnx"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/phnx-browser-${VERSION_NAME}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "artifacts/phnx-browser-${VERSION_NAME}-release-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "artifacts/phnx-browser-${VERSION_NAME}-release-unsigned.aab"
          printf 'applicationId=com.phoenix.phnx\nversionName=%s\nversionCode=%s\nreleaseSigning=unsigned\n' "$VERSION_NAME" "$VERSION_CODE" > artifacts/build-metadata.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: phnx-browser-${{ github.sha }}
          path: artifacts/
