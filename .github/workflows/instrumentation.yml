name: Instrumentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "system-images;android-34;google_apis;x86_64"

      - name: Run connected instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            set +e
            mkdir -p "$GITHUB_WORKSPACE/instrumentation-diagnostics"
            ready=1
            for attempt in $(seq 1 60); do
              if adb -s emulator-5554 shell cmd package list packages >/dev/null 2>&1 && \
                adb -s emulator-5554 shell cmd activity get-config >/dev/null 2>&1; then
                ready=0
                break
              fi
              sleep 5
            done
            if [ "$ready" -ne 0 ]; then
              echo "Android framework services did not become ready." >&2
              adb -s emulator-5554 shell getprop > "$GITHUB_WORKSPACE/instrumentation-diagnostics/getprop.txt" 2>&1 || true
              status=1
            else
              ./gradlew connectedDebugAndroidTest --stacktrace
              status=$?
            fi
            adb -s emulator-5554 logcat -d -v threadtime > "$GITHUB_WORKSPACE/instrumentation-diagnostics/logcat.txt" || true
            cp -R app/build/reports/androidTests "$GITHUB_WORKSPACE/instrumentation-diagnostics/reports" || true
            cp -R app/build/outputs/androidTest-results "$GITHUB_WORKSPACE/instrumentation-diagnostics/results" || true
            exit $status

      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-diagnostics-${{ github.sha }}
          path: ${{ github.workspace }}/instrumentation-diagnostics
          if-no-files-found: ignore
