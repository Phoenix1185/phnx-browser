name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/branding/app-icon/**'
      - 'index.html'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build static website
        run: python3 website/build.py

      - name: Prepare site
        run: |
          test -s website/index.html
          test -s website/assets/phnx-browser-app-icon.png
          test -s website/assets/site.css
          test -s website/assets/site.js
          python3 - <<'PY'
          from pathlib import Path

          required_routes = [
              "index.html", "features/index.html", "download/index.html",
              "releases/index.html", "changelog/index.html", "privacy/index.html",
              "security/index.html", "about/index.html", "legal/index.html",
              "docs/index.html", "docs/getting-started/index.html",
              "docs/profiles/index.html", "docs/network/index.html",
              "docs/privacy-security/index.html", "docs/ad-blocking/index.html",
              "docs/performance/index.html", "docs/updates/index.html",
              "docs/default-browser/index.html", "docs/permissions/index.html",
              "docs/troubleshooting/index.html", "docs/developer/index.html",
              "website/index.html",
          ]
          missing = [route for route in required_routes if not (Path("website") / route).is_file()]
          assert not missing, f"missing website routes: {missing}"
          assert (Path("website") / "sitemap.xml").is_file()
          assert (Path("website") / "robots.txt").is_file()
          assert (Path("website") / "404.html").is_file()
          html = "\n".join(path.read_text() for path in Path("website").rglob("*.html"))
          assert "PHNX Browser" in html
          assert "https://github.com/Phoenix1185/phnx-browser" in html
          assert "Android download coming soon" not in html
          for secret_marker in ("ghp_", "github_pat_", "BEGIN PRIVATE KEY", "PHNX_KEYSTORE_PASSWORD"):
              assert secret_marker not in html, f"secret marker found: {secret_marker}"
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
