name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'assets/branding/app-icon/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare site
        run: |
          test -s website/index.html
          test -s website/assets/phnx-browser-app-icon.png
          test "$(python3 -c 'from pathlib import Path; print(Path("website/index.html").read_text().count("PHNX Browser"))')" -gt 0

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
