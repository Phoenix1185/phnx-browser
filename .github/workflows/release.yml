name: Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PHNX_KEYSTORE_PASSWORD: ${{ secrets.PHNX_KEYSTORE_PASSWORD }}
      PHNX_KEY_ALIAS: ${{ secrets.PHNX_KEY_ALIAS }}
      PHNX_KEY_PASSWORD: ${{ secrets.PHNX_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Require release secrets
        env:
          KEYSTORE: ${{ secrets.PHNX_KEYSTORE_BASE64 }}
          UPDATE_SIGNING_KEY: ${{ secrets.PHNX_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "PHNX_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$PHNX_KEYSTORE_PASSWORD" || { echo "PHNX_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$PHNX_KEY_ALIAS" || { echo "PHNX_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$PHNX_KEY_PASSWORD" || { echo "PHNX_KEY_PASSWORD is not configured" >&2; exit 1; }
          test -n "$UPDATE_SIGNING_KEY" || { echo "PHNX_UPDATE_SIGNING_KEY_BASE64 is not configured" >&2; exit 1; }

      - name: Require version-matched tag
        run: |
          VERSION_NAME=$(python3 -c "import re; print(re.search(r'versionName = (.+)', open('app/build.gradle.kts').read()).group(1).strip().strip(chr(34)))")
          test "$RELEASE_TAG" = "v$VERSION_NAME" || {
            echo "Release tag $RELEASE_TAG does not match app version $VERSION_NAME" >&2
            exit 1
          }

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.PHNX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/phnx-release.keystore"
          test -s "$RUNNER_TEMP/phnx-release.keystore"

      - name: Decode update signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.PHNX_UPDATE_SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$UPDATE_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/phnx-update-signing-key.pem"
          chmod 600 "$RUNNER_TEMP/phnx-update-signing-key.pem"
          openssl pkey -in "$RUNNER_TEMP/phnx-update-signing-key.pem" -check -noout
          EXPECTED_UPDATE_PUBLIC_KEY=$(python3 - <<'PY'
          import re

          text = open("app/src/main/java/com/phoenix/phnx/update/UpdateSigningKey.kt").read()
          match = re.search(r"PUBLIC_KEY_BASE64_DER\s*=\s*\n\s*\"([^\"]+)\"", text)
          if not match:
              raise SystemExit("embedded update public key was not found")
          print(match.group(1))
          PY
          )
          ACTUAL_UPDATE_PUBLIC_KEY=$(openssl pkey -in "$RUNNER_TEMP/phnx-update-signing-key.pem" -pubout -outform DER | base64 -w0)
          test "$ACTUAL_UPDATE_PUBLIC_KEY" = "$EXPECTED_UPDATE_PUBLIC_KEY" || {
            echo "update signing key does not match the embedded PHNX public key" >&2
            exit 1
          }

      - name: Build signed APK and AAB
        env:
          PHNX_KEYSTORE_PATH: ${{ runner.temp }}/phnx-release.keystore
        run: |
          ./gradlew lint test assembleRelease bundleRelease

      - name: Verify signed artifacts
        env:
          PHNX_KEYSTORE_PATH: ${{ runner.temp }}/phnx-release.keystore
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          CERTIFICATE="$RUNNER_TEMP/phnx-release-cert.der"
          AAB_CERTIFICATE="$RUNNER_TEMP/phnx-aab-certificate.txt"
          AAB_VERIFY_LOG="$RUNNER_TEMP/phnx-aab-jarsigner.txt"

          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          test -s "$AAB"

          keytool -exportcert \
            -keystore "$PHNX_KEYSTORE_PATH" \
            -storepass "$PHNX_KEYSTORE_PASSWORD" \
            -alias "$PHNX_KEY_ALIAS" \
            -file "$CERTIFICATE"
          EXPECTED_CERTIFICATE_SHA256=$(sha256sum "$CERTIFICATE" | cut -d' ' -f1)

          jarsigner -verify -verbose -certs "$AAB" > "$AAB_VERIFY_LOG"
          keytool -printcert -jarfile "$AAB" > "$AAB_CERTIFICATE"
          ACTUAL_CERTIFICATE_SHA256=$(awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}' "$AAB_CERTIFICATE")

          test -n "$ACTUAL_CERTIFICATE_SHA256" || {
            echo "AAB signer certificate fingerprint was not found" >&2
            exit 1
          }
          test "$ACTUAL_CERTIFICATE_SHA256" = "$EXPECTED_CERTIFICATE_SHA256" || {
            echo "AAB signer certificate does not match the configured release keystore" >&2
            exit 1
          }

      - name: Stage release metadata
        env:
          UPDATE_SIGNING_KEY_PATH: ${{ runner.temp }}/phnx-update-signing-key.pem
        run: |
          mkdir -p release
          APK_NAME="phnx-browser-${RELEASE_TAG}.apk"
          AAB_NAME="phnx-browser-${RELEASE_TAG}.aab"
          MINIMUM_SUPPORTED_VERSION_CODE=1
          cp app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "release/$AAB_NAME"

          VERSION_NAME=$(python3 -c "import re; print(re.search(r'versionName = (.+)', open('app/build.gradle.kts').read()).group(1).strip().strip(chr(34)))")
          VERSION_CODE=$(python3 -c "import re; print(re.search(r'versionCode = (\\d+)', open('app/build.gradle.kts').read()).group(1))")
          APK_SHA256=$(sha256sum "release/$APK_NAME" | cut -d' ' -f1)
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$APK_NAME"

          python3 - "$RUNNER_TEMP/phnx-update-manifest.canonical" "release/phnx-update-manifest.json" "$VERSION_NAME" "$VERSION_CODE" "$MINIMUM_SUPPORTED_VERSION_CODE" "$APK_URL" "$APK_SHA256" <<'PY'
          import json
          import sys
          from pathlib import Path

          canonical_path, manifest_path, version, version_code, minimum_supported_version_code, apk_url, apk_sha256 = sys.argv[1:]
          fields = [
              ("product", "phnx-browser"),
              ("platform", "android"),
              ("architecture", "universal"),
              ("channel", "stable"),
              ("latestVersion", version),
              ("latestVersionCode", version_code),
              ("minimumSupportedVersionCode", minimum_supported_version_code),
              ("updateType", "full"),
              ("mandatory", "false"),
              ("fullApkUrl", apk_url),
              ("fullApkSha256", apk_sha256),
              ("deltaUrl", ""),
              ("deltaSha256", ""),
          ]

          def escape(value):
              return value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r")

          canonical = "\n".join(f"{key}={escape(value)}" for key, value in fields)
          Path(canonical_path).write_bytes(canonical.encode("utf-8"))
          Path(manifest_path).write_text(json.dumps({
              "product": "phnx-browser",
              "platform": "android",
              "architecture": "universal",
              "channel": "stable",
              "latestVersion": version,
              "latestVersionCode": int(version_code),
              "minimumSupportedVersionCode": int(minimum_supported_version_code),
              "updateType": "full",
              "mandatory": False,
              "fullApkUrl": apk_url,
              "fullApkSha256": apk_sha256,
          }, indent=2) + "\n")
          PY

          openssl dgst -sha256 \
            -sign "$UPDATE_SIGNING_KEY_PATH" \
            -out "$RUNNER_TEMP/phnx-update-manifest.sig" \
            "$RUNNER_TEMP/phnx-update-manifest.canonical"
          python3 - "release/phnx-update-manifest.json" "$RUNNER_TEMP/phnx-update-manifest.sig" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          manifest_path, signature_path = sys.argv[1:]
          manifest = json.loads(Path(manifest_path).read_text())
          manifest["signature"] = base64.b64encode(Path(signature_path).read_bytes()).decode("ascii")
          Path(manifest_path).write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          sha256sum "release/$APK_NAME" "release/$AAB_NAME" release/phnx-update-manifest.json > release/SHA256SUMS
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$GITHUB_SHA" > release/build-metadata.txt
          printf '%s\n' \
            "PHNX Browser ${RELEASE_TAG}" \
            "Patch release adding thermal-aware inactive WebView cleanup while preserving verified APK update delivery." \
            "" \
            "Highlights:" \
            "- Thermal-status response that releases eligible inactive WebViews" \
            "- Automatic or manual update mode" \
            "- Verified update downloads with Android installer handoff" \
            "- Fast Android browsing" \
            "- Privacy-focused browsing" \
            "- Tabs and navigation" \
            "- History and bookmarks" \
            "- Link context actions" \
            "- Proxy support" \
            "- Account/login integration" \
            "- Built-in update system" \
            "- Signed release/update verification" \
            "" \
            "APK SHA-256: ${APK_SHA256}" \
            > "$RUNNER_TEMP/phnx-release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --title "PHNX Browser $RELEASE_TAG" --notes-file "$RUNNER_TEMP/phnx-release-notes.md" --verify-tag

      - name: Remove temporary release signing files
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/phnx-release.keystore" \
            "$RUNNER_TEMP/phnx-release-cert.der" \
            "$RUNNER_TEMP/phnx-aab-certificate.txt" \
            "$RUNNER_TEMP/phnx-aab-jarsigner.txt" \
            "$RUNNER_TEMP/phnx-release-notes.md" \
            "$RUNNER_TEMP/phnx-update-signing-key.pem" \
            "$RUNNER_TEMP/phnx-update-manifest.canonical" \
            "$RUNNER_TEMP/phnx-update-manifest.sig"
