name: Signed Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PHNX_KEYSTORE_PASSWORD: ${{ secrets.PHNX_KEYSTORE_PASSWORD }}
      PHNX_KEY_ALIAS: ${{ secrets.PHNX_KEY_ALIAS }}
      PHNX_KEY_PASSWORD: ${{ secrets.PHNX_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Require protected release secrets
        env:
          KEYSTORE: ${{ secrets.PHNX_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "PHNX_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$PHNX_KEYSTORE_PASSWORD" || { echo "PHNX_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$PHNX_KEY_ALIAS" || { echo "PHNX_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$PHNX_KEY_PASSWORD" || { echo "PHNX_KEY_PASSWORD is not configured" >&2; exit 1; }

      - name: Require version-matched tag
        run: |
          VERSION_NAME=$(python3 -c "import re; print(re.search(r'versionName = (.+)', open('app/build.gradle.kts').read()).group(1).strip().strip(chr(34)))")
          test "$RELEASE_TAG" = "v$VERSION_NAME" || {
            echo "Release tag $RELEASE_TAG does not match app version $VERSION_NAME" >&2
            exit 1
          }

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Decode release keystore
        env:
          KEYSTORE: ${{ secrets.PHNX_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/phnx-release.keystore"
          test -s "$RUNNER_TEMP/phnx-release.keystore"

      - name: Build signed APK and AAB
        env:
          PHNX_KEYSTORE_PATH: ${{ runner.temp }}/phnx-release.keystore
        run: |
          ./gradlew lint test assembleRelease bundleRelease

      - name: Verify signed artifacts
        env:
          PHNX_KEYSTORE_PATH: ${{ runner.temp }}/phnx-release.keystore
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          CERTIFICATE="$RUNNER_TEMP/phnx-release-cert.der"
          AAB_CERTIFICATE="$RUNNER_TEMP/phnx-aab-certificate.txt"
          AAB_VERIFY_LOG="$RUNNER_TEMP/phnx-aab-jarsigner.txt"

          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          test -s "$AAB"

          keytool -exportcert \
            -keystore "$PHNX_KEYSTORE_PATH" \
            -storepass "$PHNX_KEYSTORE_PASSWORD" \
            -alias "$PHNX_KEY_ALIAS" \
            -file "$CERTIFICATE"
          EXPECTED_CERTIFICATE_SHA256=$(sha256sum "$CERTIFICATE" | cut -d' ' -f1)

          jarsigner -verify -verbose -certs "$AAB" > "$AAB_VERIFY_LOG"
          keytool -printcert -jarfile "$AAB" > "$AAB_CERTIFICATE"
          ACTUAL_CERTIFICATE_SHA256=$(awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}' "$AAB_CERTIFICATE")

          test -n "$ACTUAL_CERTIFICATE_SHA256" || {
            echo "AAB signer certificate fingerprint was not found" >&2
            exit 1
          }
          test "$ACTUAL_CERTIFICATE_SHA256" = "$EXPECTED_CERTIFICATE_SHA256" || {
            echo "AAB signer certificate does not match the configured release keystore" >&2
            exit 1
          }

      - name: Stage release metadata
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/phnx-browser-${RELEASE_TAG}.apk
          cp app/build/outputs/bundle/release/app-release.aab release/phnx-browser-${RELEASE_TAG}.aab
          sha256sum release/* > release/SHA256SUMS
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$GITHUB_SHA" > release/build-metadata.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/* --generate-notes --verify-tag

      - name: Remove temporary release signing files
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/phnx-release.keystore" \
            "$RUNNER_TEMP/phnx-release-cert.der" \
            "$RUNNER_TEMP/phnx-aab-certificate.txt" \
            "$RUNNER_TEMP/phnx-aab-jarsigner.txt"
